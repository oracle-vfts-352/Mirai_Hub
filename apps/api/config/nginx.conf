events { 
    worker_connections 1024; 
}

http {
    upstream mirai_backend {
        least_conn; # Routes traffic to whichever backend instance has the fewest active tasks
        server api-server:5000; 
    }

    server {
        listen 80;
        server_name localhost;
        server_tokens off; # Hides software details from security scanners

        location / {
            proxy_pass http://mirai_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Enable WebSockets support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
