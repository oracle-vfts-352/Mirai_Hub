events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    upstream mirai_backend {
        server api-server:5000;
        keepalive 16;
    }

    server {
        listen 80;
        server_name localhost;
        server_tokens off;
        client_max_body_size 200k; # the API itself rejects JSON bodies over 100kb

        root /usr/share/nginx/html;
        index index.html;

        # Avatar upload: the only route that accepts a bigger body (API limit: 2 MB file)
        location = /api/me/avatar {
            client_max_body_size 3m;
            proxy_pass http://mirai_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API
        location /api/ {
            proxy_pass http://mirai_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # nginx is the public edge: ignore any client-supplied value, the rate limiter trusts this
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Built JS/CSS files have hashed names, so browsers may cache them for a long time
        location /assets/ {
            expires 1y;
            try_files $uri =404;
        }

        # index.html must always be re-checked (it points at the current hashed files)
        location = /index.html {
            expires -1;
        }

        # Single-page app: unknown paths fall back to index.html so reloads and deep links work
        location / {
            try_files $uri /index.html;
        }
    }
}