events {
    worker_connections 1024;
}

http {
    upstream mirai_backend {
        server api-server:5000;
        keepalive 16;
    }

    server {
        listen 80;
        server_name localhost;
        server_tokens off;
        client_max_body_size 200k; # the API itself rejects bodies over 100kb

        # API
        location /api/ {
            proxy_pass http://mirai_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # nginx is the public edge: ignore any client-supplied value, the rate limiter trusts this
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Placeholder until the frontend exists. Later: serve the built web app here.
        location / {
            default_type text/plain;
            return 200 "Mirai Hub\n";
        }
    }
}