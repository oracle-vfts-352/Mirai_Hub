# Core global configurations
events { 
    worker_connections 1024; 
}

http {
    # 1. THE LOAD BALANCER (Horizontal Scalability Engine)
    upstream mirai_backend {
        least_conn; # Routes new users to whichever app instance is currently least busy 🚀
        
        server api-server:5000; # 🌟 Swapped to your internal docker-compose service hostname!
    }

    server {
        listen 80;
        server_name localhost;

        # 2. SECURITY HARDENING DEFENSES (Hides software footprints from Nmap/Masscan)
        server_tokens off; # Tells hackers absolutely nothing about our exact software versions

        # 3. GLOBAL ROUTING PROXIES
        location / {
            proxy_pass http://mirai_backend;
            
            # Forward crucial client identity network metadata blocks safely
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Enable WebSockets so live updates don't lag or lose frames
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
