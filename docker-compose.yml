services:
  nginx:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile.nginx
    container_name: mirai-nginx
    ports:
      - "8080:80"
    depends_on:
      - api-server
    networks:
      - mirai-network

  api-server:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    container_name: mirai-api-server
    command: sh -c "npx prisma migrate deploy --schema=packages/database/schema.prisma && node apps/api/dist/server.js"
    environment:
      - PORT=5000
      - NODE_ENV=development
      - REDIS_URL=redis://redis-cache:6379
      - DATABASE_URL=postgresql://mirai_admin:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres-db:5432/mirai_hub?schema=public
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - RP_ID=localhost
      - ORIGIN=http://localhost:8080
      # Object storage (dev: SeaweedFS). Values come from the root .env
      - S3_ENDPOINT=http://seaweedfs:8333
      - S3_REGION=us-east-1
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
      - S3_BUCKET=mirai-media
      - MEDIA_PUBLIC_URL=http://localhost:8333/mirai-media
            # Outgoing mail (dev: Mailpit)
      - SMTP_HOST=mailpit
      - SMTP_PORT=1025
      - SMTP_FROM=Mirai Hub <noreply@mirai-hub.local>
    depends_on:
      postgres-db:
        condition: service_healthy
      redis-cache:
        condition: service_started
      seaweedfs:
        condition: service_started
    networks:
      - mirai-network

  queue-worker:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    container_name: mirai-queue-worker
    command: node apps/api/dist/run-worker.js
    environment:
      - NODE_ENV=development
      - REDIS_URL=redis://redis-cache:6379
      - DATABASE_URL=postgresql://mirai_admin:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres-db:5432/mirai_hub?schema=public
      # config.ts requires these even though the worker doesn't use them
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - RP_ID=localhost
      - ORIGIN=http://localhost:8080
    depends_on:
      postgres-db:
        condition: service_healthy
      redis-cache:
        condition: service_started
    networks:
      - mirai-network

  redis-cache:
    image: redis:alpine
    container_name: mirai-redis-cache
    ports:
      - "127.0.0.1:6380:6379"
    networks:
      - mirai-network

  postgres-db:
    image: postgres:16-alpine
    container_name: mirai-postgres-db
    environment:
      - POSTGRES_USER=mirai_admin
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - POSTGRES_DB=mirai_hub
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mirai_admin -d mirai_hub"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - mirai-network

  # Local stand-in for Cloudflare R2 (S3 API). Dev only. MinIO is archived, see state.md.
  # docker/seaweedfs-s3.json is NOT tracked in git (copy docker/seaweedfs-s3.example.json).
  seaweedfs:
    image: chrislusf/seaweedfs:4.06
    container_name: mirai-seaweedfs
    command: server -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -dir=/data
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - seaweed_data:/data
      - ./docker/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
    networks:
      - mirai-network
  
    # Local mail catcher (dev only, never in production): SMTP on 1025, inbox in the browser on 8025.
  mailpit:
    image: axllent/mailpit:v1.31.3
    container_name: mirai-mailpit
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    networks:
      - mirai-network

networks:
  mirai-network:
    driver: bridge

volumes:
  postgres_data:
  seaweed_data: