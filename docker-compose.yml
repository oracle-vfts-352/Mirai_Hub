version: '3.8'

services:
  # 🏢 The Multi-Tenant PostgreSQL Instance
  mirai-postgres:
    image: postgres:15-alpine
    container_name: mirai-postgres-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: superSecretDBPassword2026
      POSTGRES_DB: mirai_hub_db
    ports:
      - "5432:5432" # Keep open locally for dev, block public access in production firewalls
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - mirai-network

  # ⚙️ The Node.js / TypeScript Core Backend API Server
  mirai-api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: mirai-backend-api
    restart: always
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:superSecretDBPassword2026@mirai-postgres:5432/mirai_hub_db?schema=public
      - JWT_SECRET=super_secret_tamper_proof_key_123
    depends_on:
      - mirai-postgres
    networks:
      - mirai-network

  # 🛡️ Nginx Reverse Proxy / Traffic Guard (Blocks Nmap scans and brute force)
  mirai-proxy:
    image: nginx:alpine
    container_name: mirai-nginx-proxy
    restart: always
    ports:
      - "80:80"
      - "443:4443" # For secure web/desktop traffic
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - mirai-api
    networks:
      - mirai-network

volumes:
  pgdata:

networks:
  mirai-network:
    driver: bridge