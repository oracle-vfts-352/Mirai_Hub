services:
  nginx:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.nginx
    container_name: mirai-nginx
    ports:
      - "8080:80"
    depends_on:
      - api-server
    networks:
      - mirai-network

  api-server:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    container_name: mirai-api-server
    command: sh -c "npx prisma migrate deploy --schema=packages/database/schema.prisma && node apps/api/dist/server.js"
    environment:
      - PORT=5000
      - NODE_ENV=development
      - REDIS_URL=redis://redis-cache:6379
      - DATABASE_URL=postgresql://mirai_admin:secure_postgres_pass@postgres-db:5432/mirai_hub?schema=public
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - RP_ID=localhost
      - ORIGIN=http://localhost:8080
    depends_on:
      postgres-db:
        condition: service_healthy
      redis-cache:
        condition: service_started
    networks:
      - mirai-network

  queue-worker:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    container_name: mirai-queue-worker
    command: node apps/api/dist/run-worker.js
    environment:
      - NODE_ENV=development
      - REDIS_URL=redis://redis-cache:6379
      - DATABASE_URL=postgresql://mirai_admin:secure_postgres_pass@postgres-db:5432/mirai_hub?schema=public
      # config.ts requires these even though the worker doesn't use them
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - RP_ID=localhost
      - ORIGIN=http://localhost:8080
    depends_on:
      postgres-db:
        condition: service_healthy
      redis-cache:
        condition: service_started
    networks:
      - mirai-network

  redis-cache:
    image: redis:alpine
    container_name: mirai-redis-cache
    ports:
      - "127.0.0.1:6380:6379"
    networks:
      - mirai-network

  postgres-db:
    image: postgres:16-alpine
    container_name: mirai-postgres-db
    environment:
      - POSTGRES_USER=mirai_admin
      - POSTGRES_PASSWORD=secure_postgres_pass
      - POSTGRES_DB=mirai_hub
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mirai_admin -d mirai_hub"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - mirai-network

networks:
  mirai-network:
    driver: bridge

volumes:
  postgres_data: